name: Checks

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    env:
      ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
      ANSIBLE_SSH_CONTROL_PATH_DIR: /tmp/ansible-cp

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          python -m pip install --disable-pip-version-check \
            ansible-core ansible-lint yamllint ruff
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check Bash syntax
        run: |
          bash -n xray-tui.sh
          bash -n lib/*.sh
          bash -n run.sh
          bash -n tests/test_navigation.sh
          bash -n tests/test_vault_recovery.sh

      - name: Run ShellCheck
        run: >-
          shellcheck --severity=error xray-tui.sh lib/*.sh run.sh
          tests/test_navigation.sh tests/test_vault_recovery.sh

      - name: Run TUI navigation smoke test
        run: bash tests/test_navigation.sh

      - name: Run Vault recovery tests
        run: bash tests/test_vault_recovery.sh

      - name: Check Python syntax
        run: python -m compileall -q scripts

      - name: Run Ruff
        run: ruff check scripts

      - name: Run YAML lint
        run: yamllint -d relaxed ansible .github/workflows

      - name: Check Ansible syntax
        run: |
          for playbook in \
            ansible/bootstrap.yml \
            ansible/harden_ssh.yml \
            ansible/preflight.yml \
            ansible/remove.yml \
            ansible/restart.yml \
            ansible/rotate-ssh.yml \
            ansible/site.yml; do
            ansible-playbook --syntax-check \
              -i 'xray_nodes,' -c local "$playbook"
          done

      - name: Run Ansible lint
        run: ansible-lint --offline --profile production ansible

      - name: Check changed whitespace
        run: git diff --check HEAD^ HEAD
