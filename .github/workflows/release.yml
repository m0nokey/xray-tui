name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Run CI before release
    uses: ./.github/workflows/checks.yml
    with:
      ref: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.tag || github.ref_name }}
    permissions:
      contents: read

  release:
    name: Build and publish release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Build release archive
        env:
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="xray-tui-${RELEASE_TAG}.tar.gz"
          latest_archive="xray-tui-latest.tar.gz"
          root="xray-tui-${RELEASE_TAG}"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT

          mkdir -p "$staging/$root"
          git archive --format=tar "$RELEASE_TAG" \
            | tar -xf - -C "$staging/$root"

          printf '%s\n' "$RELEASE_TAG" > "$staging/$root/VERSION"

          (
            cd "$staging/$root"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          tar -C "$staging" -czf "$archive" "$root"
          cp -- "$archive" "$latest_archive"

          printf 'RELEASE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'RELEASE_LATEST_ARCHIVE=%s\n' \
            "$latest_archive" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'CONTROLLER_IMAGE=ghcr.io/%s/xray-tui-controller\n' \
            "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          printf 'RELEASE_CONTROLLER_SBOM=%s\n' \
            "xray-tui-${RELEASE_TAG}-controller.sbom.spdx.json" >> "$GITHUB_ENV"
          printf 'RELEASE_UNBOUND_SBOM=%s\n' \
            "xray-tui-${RELEASE_TAG}-unbound.sbom.spdx.json" >> "$GITHUB_ENV"
          printf 'RELEASE_XRAY_SBOM=%s\n' \
            "xray-tui-${RELEASE_TAG}-xray.sbom.spdx.json" >> "$GITHUB_ENV"

      - name: Build Unbound image for SBOM generation
        run: |
          docker build --pull --tag xray-tui-unbound:release \
            --file ansible/roles/xray/templates/unbound.Dockerfile.j2 .

      - name: Set up QEMU
        # Pinned release commit; current release is v4.4.0.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        # Pinned release commit; current release is v4.4.1.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        # Pinned release commit; current release is v4.8.0.
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch controller image
        id: controller_image
        # Pinned release commit; current release is v7.4.0.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.CONTROLLER_IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Generate controller image SBOM
        # Pinned release commit; current release is v0.24.0.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.CONTROLLER_IMAGE }}@${{ steps.controller_image.outputs.digest }}
          format: spdx-json
          output-file: ${{ env.RELEASE_CONTROLLER_SBOM }}
          artifact-name: ${{ env.RELEASE_CONTROLLER_SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Unbound image SBOM
        # Pinned release commit; current release is v0.24.0.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: xray-tui-unbound:release
          format: spdx-json
          output-file: ${{ env.RELEASE_UNBOUND_SBOM }}
          artifact-name: ${{ env.RELEASE_UNBOUND_SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Xray image SBOM
        # Pinned release commit; current release is v0.24.0.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/xtls/xray-core:latest
          format: spdx-json
          output-file: ${{ env.RELEASE_XRAY_SBOM }}
          artifact-name: ${{ env.RELEASE_XRAY_SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Create release checksum manifest
        run: |
          sha256sum \
            "$RELEASE_ARCHIVE" \
            "$RELEASE_LATEST_ARCHIVE" \
            "$RELEASE_CONTROLLER_SBOM" \
            "$RELEASE_UNBOUND_SBOM" \
            "$RELEASE_XRAY_SBOM" > SHA256SUMS

      - name: Attest controller image
        # Pinned release commit; current release is v4.1.0.
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE }}
          subject-digest: ${{ steps.controller_image.outputs.digest }}
          push-to-registry: true

      - name: Attest release assets
        # Pinned release commit; current release is v4.1.0.
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ github.workspace }}/${{ env.RELEASE_ARCHIVE }}
            ${{ github.workspace }}/${{ env.RELEASE_LATEST_ARCHIVE }}
            ${{ github.workspace }}/${{ env.RELEASE_CONTROLLER_SBOM }}
            ${{ github.workspace }}/${{ env.RELEASE_UNBOUND_SBOM }}
            ${{ github.workspace }}/${{ env.RELEASE_XRAY_SBOM }}
            ${{ github.workspace }}/SHA256SUMS

      - name: Create GitHub release and upload assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          notes_file=".github/RELEASE_NOTES_${RELEASE_TAG}.md"
          notes_body=""
          if [[ -f "$notes_file" ]]; then
            notes_body="$(cat "$notes_file")"
          fi
          release_payload="$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg body "$notes_body" \
            '{tag_name: $tag, name: $tag, generate_release_notes: true} +
             (if $body == "" then {} else {body: $body} end)')"
          release="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$release_payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")"
          upload_url="$(jq -er '.upload_url | sub("\\{.*$"; "")' <<<"$release")"

          for asset in \
            "$RELEASE_ARCHIVE" \
            "$RELEASE_LATEST_ARCHIVE" \
            "$RELEASE_CONTROLLER_SBOM" \
            "$RELEASE_UNBOUND_SBOM" \
            "$RELEASE_XRAY_SBOM" \
            SHA256SUMS; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_url?name=$(basename "$asset")" >/dev/null
          done
