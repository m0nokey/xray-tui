---
- name: Rotate deploy SSH key
  hosts: xray_nodes
  become: true
  pre_tasks:
    - name: Wait for SSH access
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30
        sleep: 2
  tasks:
    - name: Install the new deploy key
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ new_deploy_authorized_key }}"
        state: present
        manage_dir: true

    - name: Remove the old deploy key
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ old_deploy_authorized_key }}"
        state: absent
        manage_dir: true
