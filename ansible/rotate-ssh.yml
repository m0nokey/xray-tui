---
- name: Rotate deploy SSH key
  hosts: xray_nodes
  become: true
  pre_tasks:
    - name: Wait for SSH access
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30
        sleep: 2
  tasks:
    - name: Ensure deploy SSH directory permissions
      ansible.builtin.file:
        path: /home/deploy/.ssh
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"

    - name: Install the new deploy key
      ansible.builtin.lineinfile:
        path: /home/deploy/.ssh/authorized_keys
        line: "{{ new_deploy_authorized_key }}"
        regexp: "^{{ new_deploy_authorized_key | regex_escape }}$"
        create: true
        owner: deploy
        group: deploy
        mode: "0600"
        state: present

    - name: Remove the old deploy key
      ansible.builtin.lineinfile:
        path: /home/deploy/.ssh/authorized_keys
        line: "{{ old_deploy_authorized_key }}"
        regexp: "^{{ old_deploy_authorized_key | regex_escape }}$"
        state: absent
