---
- name: Rotate deploy SSH key
  hosts: xray_nodes
  become: true
  tasks:
    - name: Install the new deploy key
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ new_deploy_authorized_key }}"
        state: present
        manage_dir: true

    - name: Remove the old deploy key
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ old_deploy_authorized_key }}"
        state: absent
        manage_dir: true
