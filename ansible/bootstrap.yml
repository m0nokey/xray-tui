---
- name: Bootstrap Xray VPN node
  hosts: xray_nodes
  # Root can install sudo directly; other SSH users must already have sudo.
  become: "{{ (ansible_user | default('root')) != 'root' }}"
  gather_facts: false
  pre_tasks:
    - name: Wait for initial SSH access
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30
        sleep: 2
    - name: Gather VPS facts after SSH is available
      ansible.builtin.setup:
  tasks:
    - name: Bootstrap deploy access
      ansible.builtin.import_role:
        name: system_base
        tasks_from: bootstrap
