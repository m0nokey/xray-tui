---
- name: Restart Xray VPN
  hosts: xray_nodes
  become: true
  pre_tasks:
    - name: Wait for SSH access
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30
        sleep: 2
  tasks:
    - name: Restart Xray Compose service
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/xray/compose.yml
          - up
          - -d
          - --force-recreate
          - --no-deps
          - xray
      changed_when: true
