---
deploy_user: deploy
deploy_authorized_key: ""
ssh_hardening_enabled: true
system_base_manage_debian_repo: true
harden_ssh_preferred_kex:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org

system_base_required_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg2
  - lsb-release
  - python3
  - python3-docker
  - sudo

system_base_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
