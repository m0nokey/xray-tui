---
- name: Require deploy SSH key
  ansible.builtin.assert:
    that:
      - deploy_authorized_key | length > 0
    fail_msg: Pass deploy_authorized_key from the encrypted local state.

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Set Debian codename
  ansible.builtin.set_fact:
    system_base_debian_codename: "{{ ansible_facts.distribution_release }}"

- name: Configure Debian APT sources
  ansible.builtin.template:
    src: debian.sources.j2
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: "0644"
  when:
    - system_base_manage_debian_repo | bool
    - ansible_facts.os_family == "Debian"
  register: system_base_debian_sources

- name: Check default sources.list
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  when:
    - system_base_manage_debian_repo | bool
    - ansible_facts.os_family == "Debian"
  register: system_base_default_sources_list

- name: Remove default sources.list after deb822 sources are configured
  ansible.builtin.file:
    path: /etc/apt/sources.list
    state: absent
  when:
    - system_base_manage_debian_repo | bool
    - ansible_facts.os_family == "Debian"
    - system_base_default_sources_list.stat.exists | default(false)
  register: system_base_default_sources_removed

- name: Update APT cache after source changes
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.os_family == "Debian"
    - system_base_debian_sources.changed | default(false) or system_base_default_sources_removed.changed | default(false)

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ system_base_required_packages }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 86400
  when: ansible_facts.os_family == "Debian"

- name: Create Docker APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts.os_family == "Debian"

- name: Install Docker APT key
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL --proto '=https' --tlsv1.3 https://download.docker.com/linux/debian/gpg \
      | gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod 0644 /etc/apt/keyrings/docker.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker.gpg
  when: ansible_facts.os_family == "Debian"

- name: Configure Docker APT source
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts.os_family == "Debian"
  register: system_base_docker_sources

- name: Configure Docker APT pin
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/docker
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: *
      Pin: origin download.docker.com
      Pin-Priority: 900
  when: ansible_facts.os_family == "Debian"

- name: Update APT cache after Docker source changes
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.os_family == "Debian"
    - system_base_docker_sources.changed or (system_base_debian_sources.changed | default(false))

- name: Install Docker and Compose plugin
  ansible.builtin.apt:
    name: "{{ system_base_docker_packages }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 86400
  when: ansible_facts.os_family == "Debian"

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: docker
    append: true
    create_home: true
    password_lock: true
    state: present

- name: Ensure deploy SSH directory permissions
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"

- name: Install deploy authorized key
  ansible.builtin.copy:
    dest: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
    content: "{{ deploy_authorized_key | trim }}\n"

- name: Install passwordless deploy sudoers file
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      {{ deploy_user }} ALL=(ALL) NOPASSWD:ALL

- name: Generate missing SSH host keys
  ansible.builtin.command:
    cmd: ssh-keygen -A
  changed_when: false
  when: ssh_hardening_enabled | bool

- name: Detect controller SSH KEX algorithms
  ansible.builtin.command:
    cmd: ssh -Q kex
  delegate_to: localhost
  register: harden_ssh_controller_kex_cmd
  changed_when: false
  when: ssh_hardening_enabled | bool

- name: Detect VPS SSH KEX algorithms
  ansible.builtin.command:
    cmd: ssh -Q kex
  register: harden_ssh_vps_kex_cmd
  changed_when: false
  when: ssh_hardening_enabled | bool

- name: Select shared hardened SSH KEX algorithms
  ansible.builtin.set_fact:
    harden_ssh_kex_algorithms: >-
      {{
        harden_ssh_preferred_kex
        | select('in', harden_ssh_vps_kex_cmd.stdout_lines)
        | select('in', harden_ssh_controller_kex_cmd.stdout_lines)
        | join(',')
      }}
  when: ssh_hardening_enabled | bool

- name: Require shared hardened SSH KEX algorithms
  ansible.builtin.fail:
    msg: "No shared hardened SSH KEX algorithm exists between controller and VPS."
  when:
    - ssh_hardening_enabled | bool
    - harden_ssh_kex_algorithms | length == 0

- name: Check current sshd_config
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: system_base_sshd_config
  when: ssh_hardening_enabled | bool

- name: Backup current sshd_config
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.xray-tui.bak
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when:
    - ssh_hardening_enabled | bool
    - system_base_sshd_config.stat.exists | default(false)

- name: Remove obsolete Xray TUI SSH drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/90-xray-tui-hardening.conf
    state: absent
  when: ssh_hardening_enabled | bool

- name: Install complete hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_hardening_enabled | bool

- name: Reload SSH daemon after hardening
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl reload ssh || systemctl reload sshd
  args:
    executable: /bin/bash
  changed_when: false
  when: ssh_hardening_enabled | bool

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
