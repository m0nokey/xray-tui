---
- name: Validate local encrypted runtime state
  ansible.builtin.assert:
    that:
      - xray_state is mapping
      - xray_state.vision_port is number
      - xray_state.xhttp_port is number
      - ssh_port is number
      - xray_state.reality_private_key | length > 0
      - xray_state.reality_public_key | length > 0
      - xray_state.reality_short_id | length > 0
      - xray_state.access_keys is sequence
    fail_msg: Pass the encrypted local Xray state and SSH port with -e @state.yml.

- name: Select DNS protection profile
  ansible.builtin.set_fact:
    xray_dns_profile: "{{ xray_state.dns_filter_profile | default('disabled') }}"

- name: Validate DNS protection profile
  ansible.builtin.assert:
    that:
      - xray_dns_profile in xray_dns_profiles
    fail_msg: "Unsupported DNS protection profile: {{ xray_dns_profile }}"

- name: Validate VPS resources for DNS protection
  ansible.builtin.assert:
    that:
      - (ansible_facts.processor_vcpus | int) >= (xray_dns_profiles[xray_dns_profile].min_vcpus | int)
      - (ansible_facts.memtotal_mb | int) >= (xray_dns_profiles[xray_dns_profile].min_memory_mb | int)
    fail_msg: >-
      DNS profile '{{ xray_dns_profile }}' requires at least
      {{ xray_dns_profiles[xray_dns_profile].min_vcpus }} vCPU and
      {{ xray_dns_profiles[xray_dns_profile].min_memory_mb }} MB RAM.
      Detected {{ ansible_facts.processor_vcpus }} vCPU and
      {{ ansible_facts.memtotal_mb }} MB RAM.
  when: xray_dns_profile != 'disabled'

- name: Create Xray directory
  ansible.builtin.file:
    path: "{{ xray_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create Unbound directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ xray_unbound_dir }}", mode: "0750" }
  when: xray_dns_profile != 'disabled'

- name: Render Unbound configuration
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: "{{ xray_unbound_config_path }}"
    owner: root
    group: root
    mode: "0644"
  when: xray_dns_profile != 'disabled'

- name: Render Unbound Dockerfile
  ansible.builtin.template:
    src: unbound.Dockerfile.j2
    dest: "{{ xray_unbound_dockerfile_path }}"
    owner: root
    group: root
    mode: "0644"
  when: xray_dns_profile != 'disabled'

- name: Validate access key pairs
  ansible.builtin.assert:
    that:
      - item.key_id is string
      - item.vision_uuid is string
      - item.xhttp_uuid is string
      - item.vision_uuid != item.xhttp_uuid
    fail_msg: "Every access key must contain two different UUIDs."
  loop: "{{ xray_state.access_keys }}"
  loop_control:
    label: "{{ item.key_id | default('unnamed') }}"

- name: Render Xray configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xray_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Xray

- name: Render Docker Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ xray_compose_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Xray

- name: Validate Unbound configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ xray_compose_path }}"
      - run
      - --rm
      - --no-deps
      - unbound
      - unbound-checkconf
      - /opt/unbound/etc/unbound/unbound.conf
  changed_when: false
  when: xray_dns_profile != 'disabled'

- name: Validate Xray configuration in a disposable container
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ xray_config_path }}:/etc/xray/config.json:ro"
      - "{{ xray_image }}"
      - run
      - -test
      - -config=/etc/xray/config.json
  changed_when: false

- name: Validate REALITY target
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - "{{ xray_image }}"
      - tls
      - ping
      - "{{ xray_server_name }}"
  changed_when: false

- name: Ensure Xray stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ xray_dir }}"
    files:
      - compose.yml
    state: present
    remove_orphans: true
