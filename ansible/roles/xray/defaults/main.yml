---
xray_image: ghcr.io/xtls/xray-core:latest
xray_dir: /opt/xray
xray_config_path: "{{ xray_dir }}/config.json"
xray_compose_path: "{{ xray_dir }}/compose.yml"
xray_container_name: xray
xray_server_name: github.com
xray_public_host: "{{ ansible_host | default(inventory_hostname) }}"
xray_xhttp_path: /
xray_unbound_dir: "{{ xray_dir }}/unbound"
xray_unbound_dockerfile_path: "{{ xray_unbound_dir }}/Dockerfile"
xray_unbound_config_path: "{{ xray_unbound_dir }}/unbound.conf"
# Keep the resolver address stable so Xray does not have to resolve its own
# DNS server name.
xray_dns_network_subnet: 172.31.254.0/28
xray_unbound_ipv4: 172.31.254.2
# Empirical reference: the six Full sources used by Nitka contain about
# 520,600 entries and used about 600 MB RSS after Unbound loaded the RPZ data.
xray_dns_reference_entries: 520600
xray_dns_reference_memory_mb: 600
xray_dns_memory_headroom_mb: 1024
xray_dns_memory_round_mb: 256
xray_dns_sources:
  urlhaus:
    label: URLhaus
    entries: "~611"
    url: https://urlhaus.abuse.ch/downloads/rpz/
    zonefile: /opt/unbound/etc/unbound/rpz/urlhaus.rpz
  hagezi-tif-mini:
    label: HaGeZi Threat Intelligence Feeds Mini
    entries: "160,610"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/tif.mini.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-tif-mini.rpz
  hagezi-doh:
    label: HaGeZi Encrypted DNS
    entries: "3,423"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/doh.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-doh.rpz
  hagezi-bypass:
    label: HaGeZi Encrypted DNS/VPN/Proxy Bypass
    entries: "17,591"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/doh-vpn-proxy-bypass.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-bypass.rpz
  adguard-cname-trackers:
    label: AdGuard CNAME Trackers
    entries: "~100,087"
    url: https://raw.githubusercontent.com/AdguardTeam/cname-trackers/master/data/combined_disguised_trackers_rpz.txt
    zonefile: /opt/unbound/etc/unbound/rpz/adguard-cname-trackers.rpz
  adguard-cname-mail:
    label: AdGuard Mail Trackers
    entries: "~98,595"
    url: https://raw.githubusercontent.com/AdguardTeam/cname-trackers/master/data/combined_disguised_mail_trackers_rpz.txt
    zonefile: /opt/unbound/etc/unbound/rpz/adguard-cname-mail.rpz
  threatfox:
    label: ThreatFox
    entries: "~45,617"
    url: https://threatfox.abuse.ch/downloads/threatfox.rpz
    zonefile: /opt/unbound/etc/unbound/rpz/threatfox.rpz
  hagezi-pro-plus:
    label: HaGeZi Pro++
    entries: "272,267"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/pro.plus.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-pro-plus.rpz
  hagezi-ultimate:
    label: HaGeZi Ultimate
    entries: "294,364"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/ultimate.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-ultimate.rpz
  hagezi-tif-medium:
    label: HaGeZi Threat Intelligence Feeds Medium
    entries: "417,094"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/tif.medium.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-tif-medium.rpz
  hagezi-tif-ips:
    label: Threat Intelligence IPs
    entries: "~54,609"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/tif-ips.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-tif-ips.rpz
  hagezi-dyndns:
    label: Dynamic DNS Threats
    entries: "1,524"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/dyndns.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-dyndns.rpz
  hagezi-spam-tlds:
    label: Suspicious Spam TLDs
    entries: "~129"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/spam-tlds-rpz.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-spam-tlds.rpz
  hagezi-popup-ads:
    label: Pop-up Ads
    entries: "56,598"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/popupads.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-popup-ads.rpz
  hagezi-nsfw:
    label: Adult Content
    entries: "110,004"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/nsfw.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-nsfw.rpz
  hagezi-gambling-mini:
    label: Gambling Mini
    entries: "94,060"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/gambling.mini.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-gambling-mini.rpz
  hagezi-gambling-medium:
    label: Gambling Medium
    entries: "155,276"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/gambling.medium.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-gambling-medium.rpz
  hagezi-gambling-full:
    label: Gambling Full
    entries: "357,251"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/gambling.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-gambling-full.rpz
  hagezi-social:
    label: Social Networks
    entries: "898"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/social.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-social.rpz
  hagezi-safesearch:
    label: SafeSearch
    entries: "206"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/nosafesearch.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-safesearch.rpz
  hagezi-anti-piracy:
    label: Anti Piracy
    entries: "36,844"
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/anti.piracy.txt
    zonefile: /opt/unbound/etc/unbound/rpz/hagezi-anti-piracy.rpz

xray_dns_profiles:
  disabled:
    min_vcpus: 0
    min_memory_mb: 0
    recommended_memory_mb: 0
    source_names: []
  minimal:
    min_vcpus: 1
    min_memory_mb: 1280
    recommended_memory_mb: 1536
    source_names: [urlhaus]
  optimal:
    min_vcpus: 1
    min_memory_mb: 1280
    recommended_memory_mb: 2048
    source_names: [urlhaus, hagezi-tif-mini]
  full:
    min_vcpus: 2
    min_memory_mb: 1792
    recommended_memory_mb: 4096
    source_names:
      - urlhaus
      - hagezi-doh
      - adguard-cname-trackers
      - adguard-cname-mail
      - threatfox
      - hagezi-pro-plus
  maximum:
    min_vcpus: 2
    min_memory_mb: 2304
    recommended_memory_mb: 4096
    source_names:
      - urlhaus
      - hagezi-bypass
      - adguard-cname-trackers
      - adguard-cname-mail
      - threatfox
      - hagezi-ultimate
      - hagezi-tif-medium
      - hagezi-tif-ips
      - hagezi-dyndns
      - hagezi-spam-tlds
  custom:
    min_vcpus: 1
    min_memory_mb: 768
    recommended_memory_mb: 4096
    source_names: []
